<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title id="pageTitle">Admin - Products</title>
</head>
<body>
    <div id="content">
        <div class="container-fluid py-5">
            <div class="row">
                <!-- Admin Sidebar -->
                <div class="col-lg-2">
                    <div class="card shadow-sm mb-4">
                        <div class="list-group list-group-flush">
                            <a th:href="@{/admin}" class="list-group-item list-group-item-action">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                            <a th:href="@{/admin/products}" class="list-group-item list-group-item-action active">
                                <i class="bi bi-box me-2"></i>Products
                            </a>
                            <a th:href="@{/admin/categories}" class="list-group-item list-group-item-action">
                                <i class="bi bi-tags me-2"></i>Categories
                            </a>
                            <a th:href="@{/admin/orders}" class="list-group-item list-group-item-action">
                                <i class="bi bi-cart me-2"></i>Orders
                            </a>
                            <a th:href="@{/admin/users}" class="list-group-item list-group-item-action">
                                <i class="bi bi-people me-2"></i>Users
                            </a>
                            <a th:href="@{/admin/analytics}" class="list-group-item list-group-item-action">
                                <i class="bi bi-graph-up me-2"></i>Analytics
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="col-lg-10">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="card-title mb-0">Products</h5>
                                <button class="btn btn-primary" data-bs-toggle="modal" 
                                        data-bs-target="#addProductModal">
                                    <i class="bi bi-plus me-2"></i>Add Product
                                </button>
                            </div>

                            <!-- Filters -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-3">
                                    <select class="form-select" id="categoryFilter">
                                        <option value="">All Categories</option>
                                        <option th:each="category : ${categories}"
                                                th:value="${category.id}"
                                                th:text="${category.name}">
                                            Category
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="stockFilter">
                                        <option value="">Stock Status</option>
                                        <option value="in_stock">In Stock</option>
                                        <option value="low_stock">Low Stock</option>
                                        <option value="out_of_stock">Out of Stock</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="searchInput" 
                                               placeholder="Search products...">
                                        <button class="btn btn-outline-secondary" type="button">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-outline-primary w-100" onclick="applyFilters()">
                                        Apply Filters
                                    </button>
                                </div>
                            </div>

                            <!-- Products Table -->
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>
                                                <input type="checkbox" class="form-check-input" 
                                                       onclick="toggleAllProducts(this)">
                                            </th>
                                            <th>Product</th>
                                            <th>Category</th>
                                            <th>Price</th>
                                            <th>Stock</th>
                                            <th>Status</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="product : ${products}">
                                            <td>
                                                <input type="checkbox" class="form-check-input product-checkbox" 
                                                       th:value="${product.id}">
                                            </td>
                                            <td>
                                                <div class="d-flex align-items-center">
                                                    <img th:src="${product.imageUrl}" 
                                                         class="rounded me-3" 
                                                         style="width: 48px; height: 48px; object-fit: cover;"
                                                         th:alt="${product.name}">
                                                    <div>
                                                        <h6 class="mb-0" th:text="${product.name}">
                                                            Product Name
                                                        </h6>
                                                        <small class="text-muted" 
                                                               th:text="${'SKU: ' + product.id}">
                                                            SKU: 123
                                                        </small>
                                                    </div>
                                                </div>
                                            </td>
                                            <td th:text="${product.category.name}">Category</td>
                                            <td th:text="${'$' + product.price}">$99.99</td>
                                            <td th:text="${product.quantity}">100</td>
                                            <td>
                                                <span class="badge" 
                                                      th:classappend="${
                                                          product.quantity > 10 ? 'bg-success' :
                                                          product.quantity > 0 ? 'bg-warning' :
                                                          'bg-danger'
                                                      }"
                                                      th:text="${
                                                          product.quantity > 10 ? 'In Stock' :
                                                          product.quantity > 0 ? 'Low Stock' :
                                                          'Out of Stock'
                                                      }">
                                                    Status
                                                </span>
                                            </td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-outline-primary"
                                                            th:onclick="'editProduct(' + ${product.id} + ')'">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger"
                                                            th:onclick="'deleteProduct(' + ${product.id} + ')'">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Bulk Actions -->
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <div class="btn-group">
                                    <button class="btn btn-outline-danger" onclick="deleteSelectedProducts()">
                                        Delete Selected
                                    </button>
                                    <button class="btn btn-outline-primary" onclick="updateSelectedProducts()">
                                        Update Stock
                                    </button>
                                </div>

                                <!-- Pagination -->
                                <nav th:if="${totalPages > 1}">
                                    <ul class="pagination mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" th:href="@{/admin/products(page=${currentPage - 1})}">
                                                Previous
                                            </a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                            th:classappend="${currentPage == i} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/products(page=${i})}" 
                                               th:text="${i + 1}">1</a>
                                        </li>
                                        <li class="page-item" 
                                            th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                            <a class="page-link" th:href="@{/admin/products(page=${currentPage + 1})}">
                                                Next
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div class="modal fade" id="productModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalTitle">Add Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        
                        <div class="row mb-3">
                            <div class="col-md-8">
                                <label for="productName" class="form-label">Product Name</label>
                                <input type="text" class="form-control" id="productName" required>
                            </div>
                            <div class="col-md-4">
                                <label for="productCategory" class="form-label">Category</label>
                                <select class="form-select" id="productCategory" required>
                                    <option value="">Select Category</option>
                                    <option th:each="category : ${categories}"
                                            th:value="${category.id}"
                                            th:text="${category.name}">
                                        Category
                                    </option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="productPrice" class="form-label">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="productPrice" 
                                           step="0.01" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="productQuantity" class="form-label">Stock Quantity</label>
                                <input type="number" class="form-control" id="productQuantity" 
                                       min="0" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="productDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="productDescription" rows="3" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="productImage" class="form-label">Product Image</label>
                            <input type="file" class="form-control" id="productImage" accept="image/*">
                            <div id="imagePreview" class="mt-2"></div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveProduct()">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Scripts -->
    <th:block id="pageScripts">
        <script th:inline="javascript">
            let productModal;
            let selectedImage = null;

            document.addEventListener('DOMContentLoaded', function() {
                productModal = new bootstrap.Modal(document.getElementById('productModal'));

                // Image preview
                document.getElementById('productImage').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        selectedImage = file;
                        const reader = new FileReader();
                        reader.onload = function(e) {
                            document.getElementById('imagePreview').innerHTML = `
                                <img src="${e.target.result}" class="img-thumbnail" style="height: 100px;">
                            `;
                        };
                        reader.readAsDataURL(file);
                    }
                });
            });

            function editProduct(productId) {
                document.getElementById('productModalTitle').textContent = 'Edit Product';
                document.getElementById('productId').value = productId;

                // Fetch product details and populate form
                fetch('/admin/products/' + productId)
                    .then(response => response.json())
                    .then(product => {
                        document.getElementById('productName').value = product.name;
                        document.getElementById('productCategory').value = product.category.id;
                        document.getElementById('productPrice').value = product.price;
                        document.getElementById('productQuantity').value = product.quantity;
                        document.getElementById('productDescription').value = product.description;
                        
                        if (product.imageUrl) {
                            document.getElementById('imagePreview').innerHTML = `
                                <img src="${product.imageUrl}" class="img-thumbnail" style="height: 100px;">
                            `;
                        }
                        
                        productModal.show();
                    });
            }

            function saveProduct() {
                const formData = new FormData();
                const productId = document.getElementById('productId').value;

                formData.append('name', document.getElementById('productName').value);
                formData.append('categoryId', document.getElementById('productCategory').value);
                formData.append('price', document.getElementById('productPrice').value);
                formData.append('quantity', document.getElementById('productQuantity').value);
                formData.append('description', document.getElementById('productDescription').value);
                
                if (selectedImage) {
                    formData.append('image', selectedImage);
                }

                const url = productId ? '/admin/products/' + productId : '/admin/products';
                const method = productId ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    headers: {
                        'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                    },
                    body: formData
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            function deleteProduct(productId) {
                if (confirm('Are you sure you want to delete this product?')) {
                    fetch('/admin/products/' + productId, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        }
                    })
                    .catch(error => console.error('Error:', error));
                }
            }

            function toggleAllProducts(checkbox) {
                document.querySelectorAll('.product-checkbox').forEach(item => {
                    item.checked = checkbox.checked;
                });
            }

            function getSelectedProducts() {
                return Array.from(document.querySelectorAll('.product-checkbox:checked'))
                    .map(checkbox => checkbox.value);
            }

            function deleteSelectedProducts() {
                const selectedProducts = getSelectedProducts();
                if (selectedProducts.length === 0) {
                    alert('Please select products to delete');
                    return;
                }

                if (confirm('Are you sure you want to delete the selected products?')) {
                    fetch('/admin/products/bulk-delete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                        },
                        body: JSON.stringify(selectedProducts)
                    })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        }
                    })
                    .catch(error => console.error('Error:', error));
                }
            }

            function updateSelectedProducts() {
                const selectedProducts = getSelectedProducts();
                if (selectedProducts.length === 0) {
                    alert('Please select products to update');
                    return;
                }

                const quantity = prompt('Enter new stock quantity:');
                if (quantity === null || quantity === '') return;

                fetch('/admin/products/bulk-update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                    },
                    body: JSON.stringify({
                        productIds: selectedProducts,
                        quantity: parseInt(quantity)
                    })
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            function applyFilters() {
                const category = document.getElementById('categoryFilter').value;
                const stock = document.getElementById('stockFilter').value;
                const search = document.getElementById('searchInput').value;

                const params = new URLSearchParams(window.location.search);
                if (category) params.set('category', category);
                if (stock) params.set('stock', stock);
                if (search) params.set('search', search);

                window.location.search = params.toString();
            }
        </script>
    </th:block>
</body>
</html>
