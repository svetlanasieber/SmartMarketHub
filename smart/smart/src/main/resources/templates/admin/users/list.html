<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title id="pageTitle">Admin - Users</title>
</head>
<body>
    <div id="content">
        <div class="container-fluid py-5">
            <div class="row">
                <!-- Admin Sidebar -->
                <div class="col-lg-2">
                    <div class="card shadow-sm mb-4">
                        <div class="list-group list-group-flush">
                            <a th:href="@{/admin}" class="list-group-item list-group-item-action">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                            <a th:href="@{/admin/products}" class="list-group-item list-group-item-action">
                                <i class="bi bi-box me-2"></i>Products
                            </a>
                            <a th:href="@{/admin/categories}" class="list-group-item list-group-item-action">
                                <i class="bi bi-tags me-2"></i>Categories
                            </a>
                            <a th:href="@{/admin/orders}" class="list-group-item list-group-item-action">
                                <i class="bi bi-cart me-2"></i>Orders
                            </a>
                            <a th:href="@{/admin/users}" class="list-group-item list-group-item-action active">
                                <i class="bi bi-people me-2"></i>Users
                            </a>
                            <a th:href="@{/admin/analytics}" class="list-group-item list-group-item-action">
                                <i class="bi bi-graph-up me-2"></i>Analytics
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="col-lg-10">
                    <div class="card shadow-sm">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <h5 class="card-title mb-0">Users</h5>
                                <button class="btn btn-primary" data-bs-toggle="modal" 
                                        data-bs-target="#addUserModal">
                                    <i class="bi bi-person-plus me-2"></i>Add User
                                </button>
                            </div>

                            <!-- Filters -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-3">
                                    <select class="form-select" id="roleFilter">
                                        <option value="">All Roles</option>
                                        <option value="ROLE_USER">Users</option>
                                        <option value="ROLE_ADMIN">Admins</option>
                                    </select>
                                </div>
                                <div class="col-md-3">
                                    <select class="form-select" id="statusFilter">
                                        <option value="">All Status</option>
                                        <option value="active">Active</option>
                                        <option value="inactive">Inactive</option>
                                    </select>
                                </div>
                                <div class="col-md-4">
                                    <div class="input-group">
                                        <input type="text" class="form-control" id="searchInput" 
                                               placeholder="Search users...">
                                        <button class="btn btn-outline-secondary" type="button">
                                            <i class="bi bi-search"></i>
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-2">
                                    <button class="btn btn-outline-primary w-100" onclick="applyFilters()">
                                        Apply Filters
                                    </button>
                                </div>
                            </div>

                            <!-- Users Table -->
                            <div class="table-responsive">
                                <table class="table table-hover align-middle">
                                    <thead>
                                        <tr>
                                            <th>
                                                <input type="checkbox" class="form-check-input" 
                                                       onclick="toggleAllUsers(this)">
                                            </th>
                                            <th>User</th>
                                            <th>Email</th>
                                            <th>Role</th>
                                            <th>Status</th>
                                            <th>Joined Date</th>
                                            <th>Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr th:each="user : ${users}">
                                            <td>
                                                <input type="checkbox" class="form-check-input user-checkbox" 
                                                       th:value="${user.id}">
                                            </td>
                                            <td>
                                                <div class="d-flex align-items-center">
                                                    <img th:src="${user.imageUrl != null ? user.imageUrl : '/img/default-avatar.png'}" 
                                                         class="rounded-circle me-3" 
                                                         style="width: 40px; height: 40px; object-fit: cover;"
                                                         th:alt="${user.username}">
                                                    <div>
                                                        <h6 class="mb-0" 
                                                            th:text="${user.firstName + ' ' + user.lastName}">
                                                            John Doe
                                                        </h6>
                                                        <small class="text-muted" th:text="${user.username}">
                                                            @johndoe
                                                        </small>
                                                    </div>
                                                </div>
                                            </td>
                                            <td th:text="${user.email}">john@example.com</td>
                                            <td>
                                                <span class="badge bg-primary" 
                                                      th:each="role : ${user.roles}" 
                                                      th:text="${#strings.substringAfter(role.name, 'ROLE_')}">
                                                    ADMIN
                                                </span>
                                            </td>
                                            <td>
                                                <span class="badge" 
                                                      th:classappend="${user.isActive ? 'bg-success' : 'bg-danger'}"
                                                      th:text="${user.isActive ? 'Active' : 'Inactive'}">
                                                    Active
                                                </span>
                                            </td>
                                            <td th:text="${#temporals.format(user.createdDate, 'dd MMM yyyy')}">
                                                01 Jan 2025
                                            </td>
                                            <td>
                                                <div class="btn-group btn-group-sm">
                                                    <button class="btn btn-outline-primary"
                                                            th:onclick="'editUser(' + ${user.id} + ')'">
                                                        <i class="bi bi-pencil"></i>
                                                    </button>
                                                    <button class="btn btn-outline-danger"
                                                            th:onclick="'deleteUser(' + ${user.id} + ')'">
                                                        <i class="bi bi-trash"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <!-- Bulk Actions -->
                            <div class="d-flex justify-content-between align-items-center mt-4">
                                <div class="btn-group">
                                    <button class="btn btn-outline-danger" onclick="deleteSelectedUsers()">
                                        Delete Selected
                                    </button>
                                    <button class="btn btn-outline-success" onclick="activateSelectedUsers()">
                                        Activate Selected
                                    </button>
                                    <button class="btn btn-outline-warning" onclick="deactivateSelectedUsers()">
                                        Deactivate Selected
                                    </button>
                                </div>

                                <!-- Pagination -->
                                <nav th:if="${totalPages > 1}">
                                    <ul class="pagination mb-0">
                                        <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                            <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1})}">
                                                Previous
                                            </a>
                                        </li>
                                        <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                            th:classappend="${currentPage == i} ? 'active'">
                                            <a class="page-link" th:href="@{/admin/users(page=${i})}" 
                                               th:text="${i + 1}">1</a>
                                        </li>
                                        <li class="page-item" 
                                            th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                            <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1})}">
                                                Next
                                            </a>
                                        </li>
                                    </ul>
                                </nav>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit User Modal -->
    <div class="modal fade" id="userModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="userModalTitle">Add User</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="userForm">
                        <input type="hidden" id="userId">
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label">First Name</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password">
                            <small class="form-text text-muted">
                                Leave empty to keep current password when editing
                            </small>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Roles</label>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="roleUser" 
                                       value="ROLE_USER" checked>
                                <label class="form-check-label" for="roleUser">User</label>
                            </div>
                            <div class="form-check">
                                <input type="checkbox" class="form-check-input" id="roleAdmin" 
                                       value="ROLE_ADMIN">
                                <label class="form-check-label" for="roleAdmin">Admin</label>
                            </div>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" class="form-check-input" id="isActive" checked>
                            <label class="form-check-label" for="isActive">Active Account</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" onclick="saveUser()">Save User</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Page Scripts -->
    <th:block id="pageScripts">
        <script th:inline="javascript">
            let userModal;

            document.addEventListener('DOMContentLoaded', function() {
                userModal = new bootstrap.Modal(document.getElementById('userModal'));
            });

            function editUser(userId) {
                document.getElementById('userModalTitle').textContent = 'Edit User';
                document.getElementById('userId').value = userId;

                // Fetch user details and populate form
                fetch('/admin/users/' + userId)
                    .then(response => response.json())
                    .then(user => {
                        document.getElementById('firstName').value = user.firstName;
                        document.getElementById('lastName').value = user.lastName;
                        document.getElementById('username').value = user.username;
                        document.getElementById('email').value = user.email;
                        document.getElementById('isActive').checked = user.isActive;
                        
                        // Set roles
                        document.getElementById('roleUser').checked = 
                            user.roles.some(role => role.name === 'ROLE_USER');
                        document.getElementById('roleAdmin').checked = 
                            user.roles.some(role => role.name === 'ROLE_ADMIN');
                        
                        userModal.show();
                    });
            }

            function saveUser() {
                const userId = document.getElementById('userId').value;
                const roles = [];
                if (document.getElementById('roleUser').checked) roles.push('ROLE_USER');
                if (document.getElementById('roleAdmin').checked) roles.push('ROLE_ADMIN');

                const userData = {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    username: document.getElementById('username').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    isActive: document.getElementById('isActive').checked,
                    roles: roles
                };

                const url = userId ? '/admin/users/' + userId : '/admin/users';
                const method = userId ? 'PUT' : 'POST';

                fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                    },
                    body: JSON.stringify(userData)
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            function deleteUser(userId) {
                if (confirm('Are you sure you want to delete this user?')) {
                    fetch('/admin/users/' + userId, {
                        method: 'DELETE',
                        headers: {
                            'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                        }
                    })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        }
                    })
                    .catch(error => console.error('Error:', error));
                }
            }

            function toggleAllUsers(checkbox) {
                document.querySelectorAll('.user-checkbox').forEach(item => {
                    item.checked = checkbox.checked;
                });
            }

            function getSelectedUsers() {
                return Array.from(document.querySelectorAll('.user-checkbox:checked'))
                    .map(checkbox => checkbox.value);
            }

            function deleteSelectedUsers() {
                const selectedUsers = getSelectedUsers();
                if (selectedUsers.length === 0) {
                    alert('Please select users to delete');
                    return;
                }

                if (confirm('Are you sure you want to delete the selected users?')) {
                    fetch('/admin/users/bulk-delete', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                        },
                        body: JSON.stringify(selectedUsers)
                    })
                    .then(response => {
                        if (response.ok) {
                            location.reload();
                        }
                    })
                    .catch(error => console.error('Error:', error));
                }
            }

            function activateSelectedUsers() {
                updateSelectedUsersStatus(true);
            }

            function deactivateSelectedUsers() {
                updateSelectedUsersStatus(false);
            }

            function updateSelectedUsersStatus(isActive) {
                const selectedUsers = getSelectedUsers();
                if (selectedUsers.length === 0) {
                    alert('Please select users to update');
                    return;
                }

                fetch('/admin/users/bulk-status-update', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRF-TOKEN': document.querySelector("meta[name='_csrf']").content
                    },
                    body: JSON.stringify({
                        userIds: selectedUsers,
                        isActive: isActive
                    })
                })
                .then(response => {
                    if (response.ok) {
                        location.reload();
                    }
                })
                .catch(error => console.error('Error:', error));
            }

            function applyFilters() {
                const role = document.getElementById('roleFilter').value;
                const status = document.getElementById('statusFilter').value;
                const search = document.getElementById('searchInput').value;

                const params = new URLSearchParams(window.location.search);
                if (role) params.set('role', role);
                if (status) params.set('status', status);
                if (search) params.set('search', search);

                window.location.search = params.toString();
            }
        </script>
    </th:block>
</body>
</html>
