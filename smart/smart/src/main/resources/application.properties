# Application Configuration
spring.application.name=smart
app.name=Smart MarketHub
app.version=1.0.0

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/smart_markethub?createDatabaseIfNotExist=true&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Disable Flyway
spring.flyway.enabled=false

# Security Configuration
app.security.jwt.secret=${JWT_SECRET:SmartMarketHubSecretKey_ThisIsAVeryLongSecretKeyForJWT_2024!}
app.security.jwt.expiration=86400000
app.security.jwt.issuer=Smart MarketHub
app.security.session.timeout=1800000
app.security.session.persistent=true
app.security.session.domain=localhost
app.security.require-ssl=false

# Feature Flags
app.features.advanced-analytics=true
app.features.user-reviews=true
app.features.recommendations=true

# Analytics Configuration
app.analytics.api-key=${ANALYTICS_API_KEY:}
app.analytics.endpoint=http://localhost:8081/api/analytics
app.analytics.enabled=true

# External services
inventory.service.url=http://localhost:8081

# Server Configuration
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# Logging Configuration
logging.level.root=INFO
logging.level.com.smartmarkethub=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
